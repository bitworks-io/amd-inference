name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
      rehearsal: ${{ steps.meta.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Resolve version and channel
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          export RELEASE_TAGS
          python3 release/resolve_version.py >> "$GITHUB_OUTPUT"
      - name: Build the unsigned package and SBOM
        env:
          VER: ${{ steps.meta.outputs.version }}
          CH: ${{ steps.meta.outputs.channel }}
          TZ: UTC
        run: |
          set -euo pipefail
          BUILT_AT=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          python3 tools/build-release.py --version "$VER" --channel "$CH" --min-agent-version 0.10.0 --built-at "$BUILT_AT" --out out
          python3 tools/build-sbom.py sbom --profile public-source --public-tree --out "out/fastllm-$VER.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned
          path: out/*
          if-no-files-found: error
          retention-days: 30

  rehearse-installer:
    needs: build
    if: needs.build.outputs.rehearsal == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VER: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned
          path: ${{ runner.temp }}/in
      - name: Build an unsigned installer from the unsigned package
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -InstallTools
          $tree = Join-Path $env:RUNNER_TEMP 'tree'
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'in/package-unsigned.zip') -DestinationPath $tree
          ./installer/build-installer.ps1 -Version $env:VER -SourceDir $tree -OutputDir (Join-Path $env:RUNNER_TEMP 'installer')
      - name: Show the Artifact Signing command syntax
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -InstallTools -WithSigningModule
          Get-Command -Module ArtifactSigning | Format-Table Name
          Get-Command Invoke-ArtifactSigning -Syntax
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsal-installer
          path: ${{ runner.temp }}/installer/*
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: needs.build.outputs.rehearsal == 'false'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VER: ${{ needs.build.outputs.version }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_CERTIFICATE: ${{ secrets.AZURE_SIGNING_CERTIFICATE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require signing secrets
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        shell: pwsh
        run: |
          Write-Error 'AZURE_CLIENT_ID is not set: refusing to produce an unsigned release.'
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned
          path: ${{ runner.temp }}/in
      - name: Prepare
        shell: pwsh
        run: |
          $in = Join-Path $env:RUNNER_TEMP 'in'
          $sha = (Get-Content -LiteralPath (Join-Path $in 'package-unsigned.sha256') -Raw).Trim()
          ./release/sign-release.ps1 -Phase Prepare -Version $env:VER -UnsignedZip (Join-Path $in 'package-unsigned.zip') -ExpectedSha256 $sha -WorkDir (Join-Path $env:RUNNER_TEMP 'w')
      - name: Read script list
        id: list
        shell: pwsh
        run: |
          $d = 'FASTLLM_LIST_EOF'
          $lines = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'w/sign-list.txt')
          "files<<$d" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $d | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install Inno Setup and the Artifact Signing module (pinned and verified; before any Azure login)
        shell: pwsh
        run: ./installer/build-installer.ps1 -InstallTools -WithSigningModule
      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign runtime scripts
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE }}
          files: ${{ steps.list.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify scripts, rebuild manifest, create catalog
        shell: pwsh
        run: ./release/sign-release.ps1 -Phase AfterScripts -WorkDir (Join-Path $env:RUNNER_TEMP 'w')
      - name: Sign catalog
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE }}
          files: ${{ runner.temp }}\w\FastLLM.cat
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify catalog and package
        shell: pwsh
        run: ./release/sign-release.ps1 -Phase AfterCatalog -WorkDir (Join-Path $env:RUNNER_TEMP 'w') -Version $env:VER
      - name: Build and sign the installer (uninstaller and Setup.exe signed during the compile)
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:VER -SourceDir (Join-Path $env:RUNNER_TEMP 'w/tree') -OutputDir (Join-Path $env:RUNNER_TEMP 'installer') -SignScript ./installer/inno-sign.ps1
      - name: Collect release assets
        shell: pwsh
        run: ./release/collect-assets.ps1 -Version $env:VER -WorkDir (Join-Path $env:RUNNER_TEMP 'w') -InstallerDir (Join-Path $env:RUNNER_TEMP 'installer') -UnsignedDir (Join-Path $env:RUNNER_TEMP 'in') -NoticesPath THIRD_PARTY_NOTICES.md -OutDir (Join-Path $env:RUNNER_TEMP 'assets')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [build, sign]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VER: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Verify the release checks out
        shell: pwsh
        run: ./release/verify-release.ps1 -AssetsDir (Join-Path $env:RUNNER_TEMP 'assets') -Version $env:VER -Tag $env:TAG -FixtureHardware (Resolve-Path tests/fixtures/rx-7900-xtx-24gb.json).Path -ReportPath (Join-Path $env:RUNNER_TEMP 'verify-report.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-report
          path: ${{ runner.temp }}/verify-report.json
          retention-days: 90

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VER: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: assets
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "FastLLM $VER (Preview)" \
                 --notes "FastLLM $VER, Preview, for Windows PCs with AMD Radeon graphics. Install with FastLLM-Setup-$VER.exe; checksums are in SHA256SUMS.")
          if [ "$CHANNEL" = "canary" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
