name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tools/build-recipes.py --check

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run planner and parser tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: Run planner and parser tests in PowerShell 7
        shell: pwsh
        run: .\tests\run-tests.ps1
      - name: Inventory, driver-guidance and download-progress tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\inventory-tests.ps1
          .\tests\native-host-inventory-tests.ps1
          .\tests\smbios-memory-tests.ps1
          .\tests\driver-guidance-tests.ps1
          .\tests\driver-guidance-view-tests.ps1
          .\tests\prerequisite-diagnostics-tests.ps1
          .\tests\vc-redist-tests.ps1
          .\tests\vc-redist-install-tests.ps1
          .\tests\ggml-vulkan-identity-tests.ps1
          .\tests\ggml-vulkan-capabilities-tests.ps1
          .\tests\pci-identity-join-tests.ps1
          .\tests\hip-candidate-probe-tests.ps1
          .\tests\selected-device-identity-tests.ps1
          .\tests\windows-vulkan-pnp-bridge-tests.ps1
          .\tests\hip-model-trial-tests.ps1
          .\tests\hip-benchmark-tests.ps1
          .\tests\hip-semantic-smoke-tests.ps1
          .\tests\hip-soak-tests.ps1
          .\tests\vulkan-capabilities-tests.ps1
          .\tests\vulkan-coopmat-screen-tests.ps1
          .\tests\download-progress-tests.ps1
      - name: Inventory, driver-guidance and download-progress tests in PowerShell 7
        shell: pwsh
        run: |
          .\tests\inventory-tests.ps1
          .\tests\native-host-inventory-tests.ps1
          .\tests\smbios-memory-tests.ps1
          .\tests\driver-guidance-tests.ps1
          .\tests\driver-guidance-view-tests.ps1
          .\tests\prerequisite-diagnostics-tests.ps1
          .\tests\vc-redist-tests.ps1
          .\tests\vc-redist-install-tests.ps1
          .\tests\ggml-vulkan-identity-tests.ps1
          .\tests\ggml-vulkan-capabilities-tests.ps1
          .\tests\pci-identity-join-tests.ps1
          .\tests\hip-candidate-probe-tests.ps1
          .\tests\selected-device-identity-tests.ps1
          .\tests\windows-vulkan-pnp-bridge-tests.ps1
          .\tests\hip-model-trial-tests.ps1
          .\tests\hip-benchmark-tests.ps1
          .\tests\hip-semantic-smoke-tests.ps1
          .\tests\hip-soak-tests.ps1
          .\tests\vulkan-capabilities-tests.ps1
          .\tests\vulkan-coopmat-screen-tests.ps1
          .\tests\download-progress-tests.ps1
      # This suite defines a fake ProcessHost type; keep it in its own shell
      # process so it cannot replace real lifecycle-test types in later steps.
      - name: Inventory parent mock tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\native-host-parent-tests.ps1
      - name: Inventory parent mock tests in PowerShell 7
        shell: pwsh
        run: .\tests\native-host-parent-tests.ps1
      - name: Lab-access helper tests in Windows PowerShell 5.1 (no setup execution)
        shell: powershell
        run: |
          .\tests\lab-access-tests.ps1
          .\tests\lab-launcher-tests.ps1
      - name: Lab-access helper tests in PowerShell 7 (no setup execution)
        shell: pwsh
        run: |
          .\tests\lab-access-tests.ps1
          .\tests\lab-launcher-tests.ps1
      - name: Private app-package setup tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\lab-app-tests.ps1
          .\tests\lab-app-lifecycle-tests.ps1
          .\tests\lab-app-ui-tests.ps1
      - name: Private app-package setup tests in PowerShell 7
        shell: pwsh
        run: |
          .\tests\lab-app-tests.ps1
          .\tests\lab-app-lifecycle-tests.ps1
          .\tests\lab-app-ui-tests.ps1
      - name: Source package acquisition tests in Windows PowerShell 5.1 (loopback only)
        shell: powershell
        run: .\tests\lab-package-download-tests.ps1
      - name: Source package acquisition tests in PowerShell 7 (loopback only)
        shell: pwsh
        run: .\tests\lab-package-download-tests.ps1
      - name: Concurrent-client mock tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\concurrency-benchmark-tests.ps1
      - name: Concurrent-client mock tests in PowerShell 7
        shell: pwsh
        run: .\tests\concurrency-benchmark-tests.ps1
      - name: Task-quality workload and concurrent transport tests in Windows PowerShell 5.1 (mock only)
        shell: powershell
        run: |
          .\tests\task-workload-tests.ps1
          .\tests\task-wave-tests.ps1
          .\tests\task-quality-benchmark-tests.ps1
      - name: Task-quality workload and concurrent transport tests in PowerShell 7 (mock only)
        shell: pwsh
        run: |
          .\tests\task-workload-tests.ps1
          .\tests\task-wave-tests.ps1
          .\tests\task-quality-benchmark-tests.ps1
      - name: Behavioral lifecycle and benchmark tests in Windows PowerShell 5.1
        shell: powershell
        run: |
          .\tests\ui-flow-tests.ps1
          .\tests\ui-prerequisite-tests.ps1
          .\tests\runtime-tests.ps1
          .\tests\start-tests.ps1
          .\tests\benchmark-tests.ps1
          .\tests\benchmark-vnext-tests.ps1
          .\tests\offload-lab-tests.ps1
          .\tests\offload-benchmark-tests.ps1
          .\tests\vulkan-fit-trial-tests.ps1
          .\tests\vulkan-fit-benchmark-tests.ps1
          .\tests\card-identity-tests.ps1
          .\tests\recipes-selection-tests.ps1
          .\tests\selftest-tests.ps1
          .\tests\trust-tests.ps1
          .\tests\semantic-smoke-tests.ps1
      - name: Behavioral lifecycle and benchmark tests in PowerShell 7
        shell: pwsh
        run: |
          .\tests\ui-flow-tests.ps1
          .\tests\ui-prerequisite-tests.ps1
          .\tests\runtime-tests.ps1
          .\tests\start-tests.ps1
          .\tests\benchmark-tests.ps1
          .\tests\benchmark-vnext-tests.ps1
          .\tests\offload-lab-tests.ps1
          .\tests\offload-benchmark-tests.ps1
          .\tests\vulkan-fit-trial-tests.ps1
          .\tests\vulkan-fit-benchmark-tests.ps1
          .\tests\card-identity-tests.ps1
          .\tests\recipes-selection-tests.ps1
          .\tests\selftest-tests.ps1
          .\tests\trust-tests.ps1
          .\tests\semantic-smoke-tests.ps1
      # Two mock suites run in the standard-user bench native gate instead of here:
      # - tests/background-host-tests.ps1: the background host refuses state it does not own, and files an elevated
      #   runner creates belong to Administrators.
      # - tests/vulkan-memory-policy-tests.ps1: it exercises real host detection; on a runner with no AMD adapter its
      #   throughput-canary case does not behave as on a Radeon PC (it passes natively on the benches).
      - name: UI background tests in Windows PowerShell 5.1 (mock only)
        shell: powershell
        run: |
          .\tests\ui-background-tests.ps1
      - name: UI background tests in PowerShell 7 (mock only)
        shell: pwsh
        run: |
          .\tests\ui-background-tests.ps1

  release-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Release metadata tests
        shell: pwsh
        run: |
          python -m unittest discover -s release -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Signing and verification Pester tests
        shell: pwsh
        run: Invoke-Pester -Path release -CI

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Inno Setup and the Artifact Signing module (pinned and verified by installer/tool-pins.json)
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -InstallTools -WithSigningModule
      - name: The pinned signing module imports the way installer/inno-sign.ps1 imports it
        shell: pwsh
        run: |
          Import-Module ArtifactSigning -RequiredVersion 0.1.20 -ErrorAction Stop
          if (-not (Get-Command Invoke-ArtifactSigning -ErrorAction SilentlyContinue)) { throw 'Invoke-ArtifactSigning not exported by the pinned module' }
          Write-Host "ArtifactSigning $((Get-Module ArtifactSigning).Version) imports and exports Invoke-ArtifactSigning"
      - name: Install, upgrade and uninstall (unsigned build)
        shell: pwsh
        run: ./tests/installer-tests.ps1

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Execute FastLLM.cmd under each script policy (Windows PowerShell 5.1)
        shell: powershell
        timeout-minutes: 10
        run: .\tests\launcher-tests.ps1

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python3 tools/leak-scan.py . --git-tracked
