          .\tests\update-tests.ps1
          .\tests\semantic-smoke-tests.ps1
      - name: Behavioral lifecycle and benchmark tests in PowerShell 7
        shell: pwsh
        run: |
          .\tests\ui-flow-tests.ps1
          .\tests\ui-prerequisite-tests.ps1
          .\tests\runtime-tests.ps1
          .\tests\start-tests.ps1
          .\tests\benchmark-tests.ps1
          .\tests\benchmark-vnext-tests.ps1
          .\tests\offload-lab-tests.ps1
          .\tests\offload-benchmark-tests.ps1
