          .\tests\offload-benchmark-tests.ps1
          .\tests\vulkan-fit-trial-tests.ps1
          .\tests\vulkan-fit-benchmark-tests.ps1
          .\tests\card-identity-tests.ps1
          .\tests\recipes-selection-tests.ps1
          .\tests\components-tests.ps1
