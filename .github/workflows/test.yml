name: test

on:
  # One run per change: pushes to main, and pull requests (not both for the same PR push). No path filters: branch
  # protection requires these checks on every PR, and a skipped workflow would leave a docs-only PR blocked.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run still in progress (release calls via workflow_call are unaffected:
# they run in the caller's concurrency group).
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 tools/check-components.py
      - run: python3 tools/build-recipes.py --check

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Each mock suite has a fresh shell for type and mock isolation. Finish independent
      # suites after failures so one hosted run reports every candidate result.
      - name: adlx-identity-vram-tests in PowerShell 7 (mock only)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\tests\adlx-identity-vram-tests.ps1
      - name: arithmetic-diagnostic-tests in Windows PowerShell 5.1 (mock only)
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\arithmetic-diagnostic-tests.ps1
      - name: arithmetic-diagnostic-tests in PowerShell 7 (mock only)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\tests\arithmetic-diagnostic-tests.ps1
      - name: backend-parity-diagnostic-tests in Windows PowerShell 5.1 (mock only)
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\backend-parity-diagnostic-tests.ps1
      - name: backend-parity-diagnostic-tests in PowerShell 7 (mock only)
