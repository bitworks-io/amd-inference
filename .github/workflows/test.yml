      - name: cpu-reference-lab-tests in PowerShell 7 (mock only)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\tests\cpu-reference-lab-tests.ps1
      - name: gpu-telemetry-tests in Windows PowerShell 5.1 (mock only)
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\tests\gpu-telemetry-tests.ps1
      - name: gpu-telemetry-tests in PowerShell 7 (mock only)
        if: ${{ !cancelled() }}
